    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
        background: #f5f7fb;
        color: #1f2937;
      }

      .app {
        display: flex;
        width: 100vw;
        height: 100vh;
      }

      .sidebar {
        width: 310px;
        flex-shrink: 0;
        padding: 20px;
        overflow-y: auto;
        background: #fff;
        border-right: 1px solid #e5e7eb;
        z-index: 2;
      }

      .sidebar h1 {
        margin: 0 0 8px;
        font-size: 22px;
        color: #111827;
      }

      .subtitle {
        margin-bottom: 20px;
        color: #6b7280;
        font-size: 13px;
        line-height: 1.6;
      }

      .search-box {
        width: 100%;
        height: 38px;
        padding: 0 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        font-size: 14px;
      }

      .search-box:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
      }

      .section {
        margin-top: 24px;
      }

      .section-title {
        margin-bottom: 12px;
        color: #374151;
        font-size: 14px;
        font-weight: 700;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .stat-card {
        padding: 12px;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
      }

      .stat-value {
        color: #111827;
        font-size: 22px;
        font-weight: 700;
      }

      .stat-label {
        margin-top: 3px;
        color: #6b7280;
        font-size: 12px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 10px 0;
        color: #4b5563;
        font-size: 13px;
      }

      .legend-color {
        width: 13px;
        height: 13px;
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 50%;
        box-shadow: 0 0 0 1px #d1d5db;
      }

      .detail {
        display: none;
        padding: 12px;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        word-break: break-all;
        font-size: 13px;
        line-height: 1.7;
      }

      .detail.show {
        display: block;
      }

      .detail-name {
        margin-bottom: 4px;
        color: #111827;
        font-size: 16px;
        font-weight: 700;
      }

      .detail-row {
        color: #4b5563;
      }

      .detail-row strong {
        color: #374151;
      }

      .graph-container {
        position: relative;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        background:
          linear-gradient(rgba(229, 231, 235, 0.55) 1px, transparent 1px),
          linear-gradient(90deg, rgba(229, 231, 235, 0.55) 1px, transparent 1px);
        background-size: 32px 32px;
      }

      .toolbar {
        position: absolute;
        top: 16px;
        right: 16px;
        display: flex;
        gap: 8px;
        z-index: 1;
      }

      .toolbar button {
        padding: 8px 12px;
        background: #fff;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        color: #374151;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      }

      .toolbar button:hover {
        background: #f3f4f6;
      }

      svg {
        width: 100%;
        height: 100%;
        cursor: grab;
      }

      svg:active {
        cursor: grabbing;
      }

      .link {
        stroke: #9ca3af;
        stroke-width: 1.8;
        stroke-opacity: 0.8;
      }

      .link-label {
        fill: #6b7280;
        font-size: 11px;
        pointer-events: none;
        user-select: none;
      }

      .node {
        cursor: pointer;
      }

      .node circle {
        stroke: #fff;
        stroke-width: 2.5px;
      }

      .node text {
        fill: #374151;
        font-size: 12px;
        pointer-events: none;
        user-select: none;
      }

      .node.dimmed,
      .link.dimmed,
      .link-label.dimmed {
        opacity: 0.12;
      }

      .node.highlighted circle {
        stroke: #111827;
        stroke-width: 3px;
      }

      .tooltip {
        position: fixed;
        display: none;
        max-width: 360px;
        padding: 10px 12px;
        background: rgba(17, 24, 39, 0.95);
        border-radius: 7px;
        color: #fff;
        font-size: 12px;
        line-height: 1.6;
        pointer-events: none;
        z-index: 10;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      }

      .empty-tip {
        position: absolute;
        top: 50%;
        left: 50%;
        display: none;
        transform: translate(-50%, -50%);
        color: #9ca3af;
        font-size: 14px;
        pointer-events: none;
      }

      @media (max-width: 700px) {
        .sidebar {
          width: 240px;
          padding: 14px;
        }

        .sidebar h1 {
          font-size: 18px;
        }
      }
    </style>
  </head>

      const colorMap = {
        component: '#6366f1',
        page: '#ef4444',
        store: '#8b5cf6',
        composable: '#10b981',
        api: '#f59e0b',
        route: '#6b7280',
        file: '#64748b',
        entry: '#0f766e',
        html: '#ea580c',
        config: '#0891b2',
        script: '#7c3aed',
        test: '#16a34a',
        style: '#db2777',
        asset: '#a16207',
        workflow: '#475569',
      };

      const typeNameMap = {
        component: 'Component',
        page: 'Page',
        store: 'Store',
        composable: 'Composable',
        api: 'API',
        route: 'Route',
        file: 'File',
        entry: 'Entry',
        html: 'HTML',
        config: 'Config',
        script: 'Script',
        test: 'Test',
        style: 'Style',
        asset: 'Asset',
        workflow: 'Workflow',
      };

      // 补全边关系中不存在的路由节点
      const nodeMap = new Map(raw.nodes.map((node) => [node.id, node]));

      raw.edges.forEach((edge) => {
        if (!nodeMap.has(edge.from)) {
          nodeMap.set(edge.from, {
            id: edge.from,
            type: 'route',
            name: edge.from.replace(/^route:/, '') || '/',
            filePath: '',
          });
        }

        if (!nodeMap.has(edge.to)) {
          nodeMap.set(edge.to, {
            id: edge.to,
            type: 'route',
            name: edge.to.replace(/^route:/, '') || '/',
            filePath: '',
          });
        }
      });

      const graphData = {
        nodes: Array.from(nodeMap.values()),
        edges: raw.edges,
      };

      const graphContainer = document.querySelector('.graph-container');
      const svg = d3.select('#graph');
      const tooltip = document.querySelector('#tooltip');
      const searchInput = document.querySelector('#search');
      const emptyTip = document.querySelector('#empty-tip');

      const width = graphContainer.clientWidth;
      const height = graphContainer.clientHeight;

      svg.attr('viewBox', `0 0 ${width} ${height}`);

      const root = svg.append('g');

      const zoom = d3
        .zoom()
        .scaleExtent([0.25, 4])
        .on('zoom', (event) => {
          root.attr('transform', event.transform);
        });

      svg.call(zoom);

      const marker = root
        .append('defs')
        .append('marker')
        .attr('id', 'arrow')
        .attr('viewBox', '0 -5 10 10')
        .attr('refX', 24)
        .attr('refY', 0)
        .attr('markerWidth', 7)
        .attr('markerHeight', 7)
        .attr('orient', 'auto');

      marker.append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', '#9ca3af');

      const nodeMapForLinks = new Map(graphData.nodes.map((node) => [node.id, node]));

      const links = graphData.edges
        .map((edge) => ({
          ...edge,
          source: nodeMapForLinks.get(edge.from),
          target: nodeMapForLinks.get(edge.to),
        }))
        .filter((edge) => edge.source && edge.target);

      document.querySelector('#node-count').textContent = graphData.nodes.length;

      document.querySelector('#edge-count').textContent = graphData.edges.length;

      const linkGroup = root.append('g').attr('class', 'links');

      const link = linkGroup
        .selectAll('line')
        .data(links)
        .join('line')
        .attr('class', 'link')
        .attr('marker-end', 'url(#arrow)');

      const linkLabel = root
        .append('g')
        .attr('class', 'link-labels')
        .selectAll('text')
        .data(links)
        .join('text')
        .attr('class', 'link-label')
        .text((d) => d.type);

      const nodeGroup = root.append('g').attr('class', 'nodes');

      const node = nodeGroup.selectAll('g').data(graphData.nodes).join('g').attr('class', 'node');

      node
        .append('circle')
        .attr('r', (d) => {
          if (d.type === 'route') return 16;
          if (d.type === 'composable') return 20;
          return 18;
        })
        .attr('fill', (d) => colorMap[d.type] || '#9ca3af');

      node
        .append('text')
        .attr('x', 25)
        .attr('y', 5)
        .text((d) => d.name);

      function getNodeRadius(nodeData) {
        if (nodeData.type === 'route') return 16;
        if (nodeData.type === 'composable') return 20;
        return 18;
      }

      const simulation = d3
        .forceSimulation(graphData.nodes)
        .force(
          'link',
          d3
            .forceLink(links)
            .id((d) => d.id)
            .distance(160)
            .strength(0.9)
        )
        .force('charge', d3.forceManyBody().strength(-600))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force(
          'collision',
          d3.forceCollide().radius((d) => getNodeRadius(d) + 38)
        )
        .on('tick', ticked);

      node.call(d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended));

      node
        .on('click', (event, d) => {
          event.stopPropagation();
          showDetail(d);
          highlightNode(d);
        })
        .on('mouseenter', (event, d) => {
          tooltip.style.display = 'block';

          tooltip.innerHTML = `
            <strong>${escapeHtml(d.name)}</strong><br>
            类型：${escapeHtml(typeNameMap[d.type] || d.type)}<br>
            文件：${escapeHtml(d.filePath || '—')}
            ${d.props?.url ? `<br>URL：${escapeHtml(d.props.url)}` : ''}
          `;

          moveTooltip(event);
        })
        .on('mousemove', moveTooltip)
        .on('mouseleave', () => {
          tooltip.style.display = 'none';
        });

      svg.on('click', () => {
        clearHighlight();
      });

      function ticked() {
        link
          .attr('x1', (d) => d.source.x)
          .attr('y1', (d) => d.source.y)
          .attr('x2', (d) => d.target.x)
          .attr('y2', (d) => d.target.y);

        linkLabel
          .attr('x', (d) => (d.source.x + d.target.x) / 2)
          .attr('y', (d) => (d.source.y + d.target.y) / 2 - 5);

        node.attr('transform', (d) => `translate(${d.x}, ${d.y})`);
      }

      function dragstarted(event, d) {
        if (!event.active) {
          simulation.alphaTarget(0.3).restart();
        }

        d.fx = d.x;
        d.fy = d.y;
      }

      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }

      function dragended(event, d) {
        if (!event.active) {
          simulation.alphaTarget(0);
        }

        d.fx = null;
        d.fy = null;
      }

      function showDetail(d) {
        const detail = document.querySelector('#detail');

        detail.classList.add('show');

        document.querySelector('#detail-name').textContent = d.name;
        document.querySelector('#detail-type').textContent = typeNameMap[d.type] || d.type;
        document.querySelector('#detail-id').textContent = d.id;
        document.querySelector('#detail-file').textContent = d.filePath || '—';

        const urlRow = document.querySelector('#detail-url-row');
        const urlElement = document.querySelector('#detail-url');

        if (d.props?.url) {
          urlRow.style.display = 'block';
          urlElement.textContent = d.props.url;
        } else {
          urlRow.style.display = 'none';
          urlElement.textContent = '-';
        }
      }

      function highlightNode(selectedNode) {
        const relatedIds = new Set([selectedNode.id]);

        links.forEach((edge) => {
          if (edge.source.id === selectedNode.id) {
            relatedIds.add(edge.target.id);
          }

          if (edge.target.id === selectedNode.id) {
            relatedIds.add(edge.source.id);
          }
        });

        node
          .classed('dimmed', (d) => !relatedIds.has(d.id))
          .classed('highlighted', (d) => d.id === selectedNode.id);

        link.classed(
          'dimmed',
          (d) => d.source.id !== selectedNode.id && d.target.id !== selectedNode.id
        );

        linkLabel.classed(
          'dimmed',
          (d) => d.source.id !== selectedNode.id && d.target.id !== selectedNode.id
        );
      }

      function clearHighlight() {
        node.classed('dimmed', false).classed('highlighted', false);
        link.classed('dimmed', false);
        linkLabel.classed('dimmed', false);
      }

      searchInput.addEventListener('input', () => {
        const keyword = searchInput.value.trim().toLowerCase();

        if (!keyword) {
          clearHighlight();
          emptyTip.style.display = 'none';
          return;
        }

        const matchedNodes = graphData.nodes.filter((nodeData) => {
          return (
            nodeData.name.toLowerCase().includes(keyword) ||
            nodeData.id.toLowerCase().includes(keyword) ||
            nodeData.filePath.toLowerCase().includes(keyword)
          );
        });

        const matchedIds = new Set(matchedNodes.map((nodeData) => nodeData.id));

        node
          .classed('dimmed', (d) => !matchedIds.has(d.id))
          .classed('highlighted', (d) => matchedIds.has(d.id));

        link.classed('dimmed', (d) => !matchedIds.has(d.source.id) && !matchedIds.has(d.target.id));

        linkLabel.classed(
          'dimmed',
          (d) => !matchedIds.has(d.source.id) && !matchedIds.has(d.target.id)
        );

        emptyTip.style.display = matchedNodes.length === 0 ? 'block' : 'none';
      });

      document.querySelector('#reset-btn').addEventListener('click', () => {
        searchInput.value = '';
        clearHighlight();
        emptyTip.style.display = 'none';

        svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);

        simulation.alpha(0.8).restart();
      });

      document.querySelector('#zoom-in-btn').addEventListener('click', () => {
        svg.transition().duration(300).call(zoom.scaleBy, 1.25);
      });

      document.querySelector('#zoom-out-btn').addEventListener('click', () => {
        svg.transition().duration(300).call(zoom.scaleBy, 0.8);
      });

      function moveTooltip(event) {
        tooltip.style.left = `${event.clientX + 14}px`;
        tooltip.style.top = `${event.clientY + 14}px`;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"]/g, (char) => {
          const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
          };

          return map[char];
        });
      }

      window.addEventListener('resize', () => {
        const newWidth = graphContainer.clientWidth;
        const newHeight = graphContainer.clientHeight;

        svg.attr('viewBox', `0 0 ${newWidth} ${newHeight}`);

        simulation
          .force('center', d3.forceCenter(newWidth / 2, newHeight / 2))
          .alpha(0.3)
          .restart();
      });
    </script>
  </body>
</html>
