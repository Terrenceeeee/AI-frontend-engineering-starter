# .github/workflows/ci.yml
name: CI 流水线

# 触发条件：push 到 main 分支，或任何 pull_request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 流水线要执行的任务列表
jobs:
  build-and-test:
    # 运行环境：最新 Ubuntu
    runs-on: ubuntu-latest

    # 任务步骤
    steps:
      # 1. 拉取代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装 pnpm
      - name: 安装 pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      # 3. 安装 Node.js
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      # 4. 安装依赖
      - name: 安装依赖
        run: pnpm install

      # 5. 代码规范检查（ESLint + Prettier）
      - name: 代码规范检查
        run: pnpm lint

      # 6. 单元测试
      - name: 单元测试
        run: pnpm test

      # 7. 打包构建
      - name: 构建项目
        run: pnpm build