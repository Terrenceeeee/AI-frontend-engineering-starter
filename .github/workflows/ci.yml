name: CI 流水线

on:
  push:
    branches: [master]
    paths:
      - "Demo2/demo2-env/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "Demo2/demo2-env/**"
      - ".github/workflows/ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Demo2/demo2-env

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: Demo2/demo2-env/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码规范检查
        run: pnpm exec eslint src --ext .vue,.js,.ts

      - name: 类型检查
        run: pnpm type-check

      - name: 格式检查
        run: pnpm format:check

      - name: 单元测试
        run: pnpm test

      - name: 覆盖率测试
        run: pnpm test:coverage

      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E 页面测试
        run: pnpm test:e2e

      - name: 构建项目
        run: pnpm build
