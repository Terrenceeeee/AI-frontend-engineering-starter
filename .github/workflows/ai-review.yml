name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
    # ⭐ 新增：只针对 Demo2/demo2-env 目录下的改动触发
    paths:
      - "Demo2/demo2-env/**"
      - ".github/workflows/ai-review.yml"
  # ⭐ 新增：支持手动触发
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # ⭐ 新增：设置工作目录为 Demo2/demo2-env
    defaults:
      run:
        working-directory: ./Demo2/demo2-env

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: Demo2/demo2-env/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成知识图谱（如果还没有）
        run: |
          if [ ! -f knowledge-graph.json ]; then
            pnpm graph
          else
            echo "✅ 知识图谱已存在，跳过生成"
          fi

      - name: 运行 AI Code Review（PR 模式）
        id: review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          pnpm ai-review --pr

      - name: 将 Review 结果发布到 PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // ⭐ 新增：AI Review 结果在子目录中生成
            const resultPath = path.join('Demo2/demo2-env', 'ai-review-result.md');

            let reviewContent = '🤖 **AI Code Review 报告**\n\n';
            try {
              const content = fs.readFileSync(resultPath, 'utf-8');
              reviewContent += content;
            } catch (e) {
              reviewContent += '⚠️ 未能生成 Review 报告，请检查脚本执行日志。';
            }

            const prNumber = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: reviewContent
            });
